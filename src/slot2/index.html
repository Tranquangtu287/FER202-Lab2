<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 1 - Grid</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
   <style>
        body {
            font-size: 0.9rem;
        }
        .banner-title {
            font-size: 1.75rem; 
            font-weight: 500; 
            color: #212529;
        }
        /* Khung ngoài tổng thể */
        .grid-container {
            border: 1px solid #b0b0b0;
            background-color: #dcdcdc;
            padding: 0px;
        }
        /* Các ô bên trong dính liền khít, không khoảng hở */
        .grid-box {
            background-color: #dcdcdc;
            border: 1px solid #b0b0b0;
            padding: 8px 12px;
            color: #333;
        }
       .footer-box {
            background-color: #D2C5C5;
            border: 1px solid #D2C5C5;
            color: #212529;
            font-weight: 600; 
            font-size: 2.0rem;
            padding-top: 20px;
            padding-bottom: 0px;
            line-height: 1;
        }
    </style>
</head>
<div class="container my-4" style="max-width: 900px;">


        <!-- Banner xám nhạt ở trên -->
        <div class="p-4 mb-3 bg-light border">
            <h1 class="banner-title m-0">Let's test the grid!</h1>
        </div>

        <!-- Khung chứa các hàng cột (dùng g-0 để các ô khít lại với nhau) -->
        <div class="grid-container mb-3">
            <!-- Hàng 1: 2 cột (6 - 6) -->
            <div class="row g-0">
                <div class="col-6">
                    <div class="grid-box">First col</div>
                </div>
                <div class="col-6">
                    <div class="grid-box">Second col</div>
                </div>
            </div>

            <!-- Hàng 2: 2 cột (4 - 8) -->
            <div class="row g-0">
                <div class="col-4">
                    <div class="grid-box">col</div>
                </div>
                <div class="col-8">
                    <div class="grid-box">col</div>
                </div>
            </div>

            <!-- Hàng 3: 4 cột (3 - 3 - 3 - 3) -->
            <div class="row g-0">
                <div class="col-3">
                    <div class="grid-box">col</div>
                </div>
                <div class="col-3">
                    <div class="grid-box">col</div>
                </div>
                <div class="col-3">
                    <div class="grid-box">col</div>
                </div>
                <div class="col-3">
                    <div class="grid-box">col</div>
                </div>
            </div>
        </div>

        <!-- Thanh Footer màu nâu xám ở dưới -->
        <div class="text-center py-2 footer-box">
            Created by ABC!
        </div>
    </div>
    
</body>
</html>
