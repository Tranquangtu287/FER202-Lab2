<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 4 - FPT Layout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
<style>
        /* Header màu cam */
        .orange-header {
            background-color: #e67e22;
            padding: 25px 20px 15px 20px;
            text-align: center;
        }
        /* Khung trắng chứa logo bên trong header */
        .logo-box {
            background-color: #ffffff;
            max-width: 500px;
            margin: 0 auto 10px auto;
            padding: 15px 20px;
        }
        /* Style cho phần chữ FPT University thay thế nếu ảnh lỗi */
        .fpt-brand-text {
            font-family: 'Times New Roman', Times, serif;
            font-weight: bold;
            color: #e67e22;
            letter-spacing: 1px;
            font-size: 1.8rem;
            margin-top: 5px;
            margin-bottom: 0;
        }
        /* Footer vàng nhạt */
        .custom-footer {
            background-color: #f8c471;
            text-align: center;
            padding: 12px 0;
            color: #ffffff;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container my-4" style="max-width: 900px;">

        <!-- Header cam & Khung Logo trắng -->
        <div class="orange-header mb-4">
            <div class="logo-box">
               
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTpxah_xmxXr-p-tM1rNl4OrVd4F2T12rP7ozDvxD1z0g&s=10" alt="FPT Education Logo" class="img-fluid mb-1" onerror="this.style.display='none'; document.getElementById('fallback-title').style.display='block';">
                
                <!-- Phần chữ dự phòng hiển thị hoàn hảo nếu chưa có file ảnh -->
                <div id="fallback-title" style="display: none;">
                    <div class="fw-bold text-primary fs-4">FPT Education</div>
                </div>
                
                <h1 class="fpt-brand-text">FPT UNIVERSITY</h1>
            </div>

            <!-- Menu nhỏ trong banner -->
            <nav class="nav justify-content-center">
                <a class="nav-link text-white py-0 px-2" href="#">Home</a>
                <a class="nav-link text-white py-0 px-2" href="#">About</a>
                <a class="nav-link text-white py-0 px-2" href="#">Contact</a>
            </nav>
        </div>

        <!-- Phần About -->
        <section class="text-center mb-4">
            <h4 class="fw-bold">About</h4>
            <p class="text-muted mb-0">This is the about section of the website.</p>
        </section>

        <!-- Phần Contact -->
        <section class="text-center mb-5">
            <h4 class="fw-bold">Contact</h4>
            <p class="text-muted mb-0">For any inquiries, please contact us at example@example.com.</p>
        </section>

        <!-- Footer -->
        <div class="custom-footer">
            &copy; 2023 Website. All rights reserved.
        </div>
    </div>
</body>
</html>
