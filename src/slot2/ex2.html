<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 2 - Bootstrap Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
<style>
       
        .custom-banner {
            background-color: #f1f3f5;
            border: 1px solid #dee2e6;
            padding: 30px 20px;
            text-align: center;
        }
        
        .custom-banner h1 {
            font-size: 1.6rem;
            font-weight: 500;
            color: #212529;
            margin: 0;
        }
       
        .tech-logo {
            width: 180px; 
            height: auto;
            max-width: 100%;
        }
    </style>
</head>
<body>
    <div class="container my-4" style="max-width: 800px;">
        
        
        <div class="custom-banner mb-4">
            <h1>My First Bootstrap Page</h1>
        </div>

        <!-- Các logo to hơn và nằm gần nhau hơn -->
        <div class="row justify-content-center align-items-center text-center g-4">
            <div class="col-auto px-4">
                <img src="https://upload.wikimedia.org/wikipedia/commons/3/38/HTML5_Badge.svg" alt="HTML5" class="tech-logo">
            </div>
            <div class="col-auto px-4">
                <img src="https://upload.wikimedia.org/wikipedia/commons/6/62/CSS3_logo.svg" alt="CSS3" class="tech-logo">
            </div>
            <div class="col-auto px-4">
                <img src="https://upload.wikimedia.org/wikipedia/commons/b/b2/Bootstrap_logo.svg" alt="Bootstrap" class="tech-logo">
            </div>
        </div>

    </div>
</body>
</html>
